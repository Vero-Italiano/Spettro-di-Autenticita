<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vero Italiano - Authenticity Spectrum</title>
<style>
  :root{
    --bg:#faf7f2;
    --card-bg:#ffffff;
    --ink:#1f2a24;
    --muted:#6b7570;
    --line:#e4ded3;
    --green:#2f5d3a;
    --green-light:#e7f0e5;
    --gold:#b8862b;
    --gold-light:#f8efdb;
    --red-it:#b7312c;
    --red-light:#fbe7e6;
    --white-it:#ffffff;
    --shadow:0 4px 18px rgba(31,42,36,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:40px 24px 80px;
  }
  .wrap{max-width:1120px;margin:0 auto;}
  header{text-align:center;margin-bottom:8px;position:relative;}
  .lang-switch{
    position:absolute;top:0;right:0;display:flex;gap:4px;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:3px;box-shadow:var(--shadow);
  }
  .lang-switch button{
    border:none;background:transparent;padding:6px 14px;border-radius:16px;font-size:12.5px;font-weight:700;
    cursor:pointer;color:var(--muted);letter-spacing:.03em;
  }
  .lang-switch button.active{background:var(--green);color:#fff;}
  .flagbar{height:4px;width:80px;margin:0 auto 20px;background:linear-gradient(90deg,var(--green) 0 33%, var(--white-it) 33% 66%, var(--red-it) 66% 100%);border-radius:2px;}
  h1{font-size:28px;margin:0 0 6px;letter-spacing:-0.01em;}
  .subtitle{color:var(--muted);font-size:15px;max-width:720px;margin:0 auto 12px;line-height:1.5;}
  h2.section-title{font-size:20px;margin:48px 0 6px;}
  .section-sub{color:var(--muted);font-size:14px;margin:0 0 24px;max-width:760px;line-height:1.5;}

  .ladder{display:flex;flex-direction:column;gap:16px;}
  .tier{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:20px 24px;
    display:grid;
    grid-template-columns:52px 1.3fr 1fr;
    gap:20px;
    align-items:start;
  }
  .tier-num{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;color:#fff;
    margin-top:2px;
  }
  .tier-tag{
    display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-bottom:8px;
  }
  .tier-title{font-size:16.5px;font-weight:700;margin:0 0 4px;}
  .tier-desc{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 10px;}
  .flags{font-size:12.5px;color:var(--ink);margin:0 0 4px;}
  .flags span{display:inline-block;background:#f1efe9;border-radius:6px;padding:2px 7px;margin:0 4px 4px 0;font-size:11.5px;color:var(--muted);}
  .example{
    background:#f5f2ec;border-radius:10px;padding:12px 14px;font-size:12.5px;
    color:var(--ink);line-height:1.55;
  }
  .example strong{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}

  /* tier color coding: 1 strongest -> 7 weakest */
  .n1 .tier-num{background:#1f6b3a;} .n1 .tier-tag{background:var(--green-light);color:var(--green);}
  .n2 .tier-num{background:#4c8a5c;} .n2 .tier-tag{background:var(--green-light);color:var(--green);}
  .n3 .tier-num{background:#8a9a52;} .n3 .tier-tag{background:#f2f3e2;color:#6b7a34;}
  .n4 .tier-num{background:var(--gold);} .n4 .tier-tag{background:var(--gold-light);color:var(--gold);}
  .n5 .tier-num{background:#c9772f;} .n5 .tier-tag{background:#fbeee0;color:#c9772f;}
  .n6 .tier-num{background:#c14f38;} .n6 .tier-tag{background:#fbe2dd;color:#c14f38;}
  .n7 .tier-num{background:var(--red-it);} .n7 .tier-tag{background:var(--red-light);color:var(--red-it);}

  /* fraud section */
  .fraud-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
  .fraud-card{
    background:var(--card-bg);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:20px 22px;
  }
  .fraud-card h3{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px;}
  .fraud-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;background:var(--red-light);color:var(--red-it);
    font-size:12px;font-weight:700;flex-shrink:0;
  }
  .fraud-card p{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 10px;}
  .fraud-card .example{margin-top:6px;}

  footer{text-align:center;margin-top:48px;color:var(--muted);font-size:12px;line-height:1.6;}

  /* premium lab badge section */
  .lab-badge-section{
    background:linear-gradient(135deg,#fdf9ec,#f7f0dc);border:1.5px solid var(--gold);border-radius:16px;
    box-shadow:var(--shadow);padding:26px 28px;
  }
  .lab-badge-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;}
  .lab-badge-icon{
    width:52px;height:52px;border-radius:50%;background:var(--gold);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:24px;
  }
  .lab-badge-title{font-size:17px;font-weight:700;margin:0 0 4px;color:#7a5a1a;}
  .lab-badge-desc{font-size:13.5px;color:#6b5a35;line-height:1.55;margin:0;}
  .lab-modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .lab-mode{background:#fffdf7;border:1px solid #e8d9ad;border-radius:10px;padding:14px 16px;font-size:12.5px;line-height:1.5;color:#5c4a25;}
  .lab-mode strong{display:block;font-size:12.5px;color:#7a5a1a;margin-bottom:4px;}
  .lab-note{
    background:#fffdf7;border:1px dashed #c9a03a;border-radius:10px;padding:12px 14px;font-size:12px;color:#6b5a35;line-height:1.55;
  }

  /* verification engine section */
  .engine{
    background:var(--card-bg);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:28px 30px;
  }
  .engine-flow{
    display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;gap:8px;margin-bottom:22px;
  }
  .stream{border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.55;}
  .stream h4{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px;}
  .stream ul{margin:0;padding-left:18px;color:var(--muted);}
  .stream ul li{margin-bottom:3px;}
  .doc-stream{background:#eef2ef;border:1px solid #d8e2dc;}
  .doc-stream h4{color:var(--green);}
  .sat-stream{background:#eef4f8;border:1px solid #d6e6ef;}
  .sat-stream h4{color:#2c6b8a;}
  .stream-icon{
    width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;color:#fff;flex-shrink:0;
  }
  .doc-stream .stream-icon{background:var(--green);}
  .sat-stream .stream-icon{background:#2c6b8a;}
  .engine-arrow{
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:22px;
  }
  .reconcile-box{
    grid-column:1 / -1;
    background:linear-gradient(135deg,#faf6ee,#f5f0e4);
    border:1.5px dashed var(--gold);border-radius:12px;
    padding:18px 22px;text-align:center;margin-top:4px;
  }
  .reconcile-box h4{margin:0 0 6px;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;}
  .reconcile-box p{margin:0;font-size:13px;color:var(--ink);max-width:640px;margin:0 auto;line-height:1.55;}
  .outcomes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  .outcome{border-radius:10px;padding:14px 16px;font-size:12.5px;line-height:1.5;}
  .outcome.ok{background:var(--green-light);color:var(--green);}
  .outcome.flag{background:var(--red-light);color:var(--red-it);}
  .outcome strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .catches{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}
  .catches h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 10px;}
  .catch-tags{display:flex;flex-wrap:wrap;gap:8px;}
  .catch-tags span{
    background:#f1efe9;border-radius:20px;padding:6px 12px;font-size:12px;color:var(--ink);
    border:1px solid var(--line);
  }

  @media (max-width:820px){
    .tier{grid-template-columns:1fr;}
    .engine-flow{grid-template-columns:1fr;}
    .engine-arrow{transform:rotate(90deg);padding:6px 0;}
    .outcomes{grid-template-columns:1fr;}
    .lang-switch{position:static;justify-content:center;margin-bottom:16px;}
  }
</style>
</head>

<script>
var translations = {
  en: {
    h1: "Vero Italiano - Authenticity Spectrum",
    subtitle: "Not a single pass/fail gate, but a spectrum from fully traceable Italian production to purely evocative branding. Each level combines three independent facts: where it's made, where the ingredients come from, and who owns the brand.",
    "s1.title": "The seven-level spectrum",
    "s1.sub": "Levels run from strongest claim to weakest. Real products can sit anywhere on this ladder, and often the label gives no indication of where.",

    "t1.tag": "Fully Verified",
    "t1.title": "Italian-made, ingredients verifiably grown in Italy",
    "t1.desc": "Product and ingredients both originate in Italy, with traceability back to the farm or production zone. The gold standard, and rare in bulk commodity categories.",
    "t1.flags": "<span>Made in Italy</span><span>Ingredients: Italy</span><span>Traceable</span>",
    "t1.example": "<strong>Real example</strong>Parmigiano Reggiano DOP and Prosciutto di Parma DOP: milk and pork must come from the designated region, and the consortium now embeds tracking chips in wheels to prove it.",

    "t2.tag": "Substantially Verified",
    "t2.title": "Italian-made, key ingredients historically/mostly Italian",
    "t2.desc": "Manufacturing and the traditional core ingredient are Italian, though sourcing isn't always guaranteed batch-to-batch (e.g. domestic durum wheat in a good harvest year).",
    "t2.flags": "<span>Made in Italy</span><span>Ingredients: mostly Italy</span>",
    "t2.example": "<strong>Real example</strong>Artisan pastificios using Italian-grown grano duro (e.g. Senatore Cappelli wheat), a shrinking category as domestic durum output falls short of demand.",

    "t3.tag": "Made in Italy, Sourced Abroad",
    "t3.title": "Italian-made, key ingredients imported",
    "t3.desc": "Manufacturing genuinely happens in Italy, but the primary raw material is imported, often undisclosed on the front label.",
    "t3.flags": "<span>Made in Italy</span><span>Ingredients: imported</span>",
    "t3.example": "<strong>Real example</strong>Italy is a net importer of olive oil: Spanish, Greek, Tunisian and Moroccan oil is shipped in bulk, bottled in Italy, and sold as \"Italian\" olive oil (Bertolli, Carapelli, Filippo Berio, Sasso and Coricelli were all cited in Italian mislabeling findings). Most \"Italian\" pasta today also runs on Canadian/US durum wheat.",

    "t4.tag": "Packaging Only",
    "t4.title": "Italian-packaged, product produced outside Italy",
    "t4.desc": "The only Italian step is the finishing/packaging stage, sometimes enough to legally claim \"Made in Italy\" under rules based on \"last substantial transformation.\"",
    "t4.flags": "<span>Packaged in Italy</span><span>Made elsewhere</span>",
    "t4.example": "<strong>Real example</strong>Prato's Chinese-owned textile factories finish garments in Italy to legally qualify for \"Made in Italy\" labels. In food, Italian processor Petti was found blending, and at times substituting, Chinese tomato paste (from Xinjiang) into cans sold as \"100% Italian tomatoes,\" triggering a 2021 seizure and a 2024 BBC investigation.",

    "t5.tag": "Brand Only + Real Ingredients",
    "t5.title": "Italian brand, produced abroad, using Italian ingredients",
    "t5.desc": "A genuine Italian company manufactures locally in a foreign market to serve it efficiently, importing bulk Italian ingredients to preserve authenticity.",
    "t5.flags": "<span>Italian brand</span><span>Made abroad</span><span>Ingredients: Italy</span>",
    "t5.example": "<strong>Real example</strong>Some Italian olive oil producers ship bulk Italian-origin oil to be bottled at destination-market facilities rather than in Italy: the ingredient is real, the \"Made in Italy\" bottling claim is not.",

    "t6.tag": "Brand Only",
    "t6.title": "Italian brand, produced abroad, primary ingredients from abroad",
    "t6.desc": "The company and heritage are genuinely Italian, but the product sold in a given market is manufactured locally end-to-end.",
    "t6.flags": "<span>Italian brand</span><span>Made abroad</span><span>Ingredients: abroad</span>",
    "t6.example": "<strong>Real example</strong>Barilla and Giovanni Rana both run U.S. manufacturing plants (Barilla: New York/Iowa; Rana: Bartlett, Illinois) using North American wheat for the North American market.",

    "t7.tag": "Evocative Only",
    "t7.title": "Italian-sounding, produced abroad, ingredients from abroad",
    "t7.desc": "No Italian ownership, manufacturing, or sourcing, just a name, flag colors, or imagery designed to evoke Italy. This is the \"Italian Sounding\" phenomenon.",
    "t7.flags": "<span>No Italian link</span><span>Made abroad</span><span>Ingredients: abroad</span>",
    "t7.example": "<strong>Real example</strong>Bertolli pasta sauce: brand licensed from the original Italian olive oil house, now owned by Japanese-American company Mizkan and made in Owensboro, Kentucky and Stockton, California with U.S. tomatoes. Industry-wide, \"Italian Sounding\" products generate an estimated 55 to 120 billion euro per year globally, with about 97% of \"Italian\" pasta sauce and 76% of canned tomatoes on the North American market found to be non-Italian.",

    "s2.title": "The verification engine: documents vs. the field",
    "s2.sub": "Every level above is a claim on paper. VeriPura tests the claim against two independent evidence streams and reconciles them, this is what turns a self-reported level into a verified one.",
    "engine.docHeading": "What the paperwork says",
    "engine.doc1": "Invoices, customs declarations, lot and shipping documents",
    "engine.doc2": "Producer/importer self-reported volumes and origin claims",
    "engine.doc3": "Registry and consortium membership records",
    "engine.satHeading": "What the field shows",
    "engine.sat1": "Satellite imagery of planted area, crop health and harvest timing",
    "engine.sat2": "Agronomic yield models for the region/varietal/season",
    "engine.sat3": "Independent estimate of maximum plausible production volume",
    "engine.reconcileHeading": "Reconciliation",
    "engine.reconcileDesc": "Declared volume and origin are compared against the independently estimated production capacity for that grower, plot and season. A close match raises confidence; a gap flags the claim for review before certification is issued.",
    "engine.ok": "<strong>Within expected range</strong>Declared volume is consistent with satellite-estimated yield capacity, the claim supports the certification level requested.",
    "engine.flag": "<strong>Flagged for review</strong>Declared volume exceeds plausible field output, signaling undisclosed blending, substitution, or overstated origin (as in the Petti tomato-paste case).",
    "engine.catchesHeading": "What this specifically catches",
    "engine.catch1": "Level 3, undisclosed imported ingredients",
    "engine.catch2": "Level 4, packaging-only \"Made in Italy\" claims",
    "engine.catch3": "Fraud #4, undisclosed origin substitution",
    "engine.catch4": "Volume overstatement beyond real production capacity",

    "s2b.title": "Premium tier: Lab-Verified certification",
    "s2b.sub": "Documents and satellite data confirm a plausible story. They cannot confirm what is physically inside the package. This optional premium layer adds independent forensic testing on top of any spectrum level.",
    "lab.title": "Vero Italiano Lab-Verified",
    "lab.desc": "A distinct, premium badge layered on top of the seven-level spectrum, backed by accredited physical/forensic testing (stable isotope ratio analysis, DNA barcoding, NMR profiling) rather than documents and imagery alone. Requires ISO 17025 (or equivalent) accredited lab partners and a documented chain of custody, so results hold up under dispute.",
    "lab.mode1.h": "Test-on-demand",
    "lab.mode1.p": "An importer, or the reconciliation engine itself when a discrepancy is flagged, triggers a lab test on a specific lot. Billed per test plus margin, this gives an importer a concrete result to point to with a skeptical retail buyer.",
    "lab.mode2.h": "Risk-weighted random testing",
    "lab.mode2.p": "Certified lots are periodically and unpredictably selected for surprise testing, weighted toward higher-value products and any prior discrepancy history, funded from the subscription/fee pool or by an interested consortium. This is what keeps a certification honest between audits, rather than a one-time check a bad actor can plan around.",
    "lab.note": "Why accreditation is non-negotiable: in Australia's 2026 Four Corners tomato investigation, the forensic lab behind the fraud findings (Source Certain) was not NATA-accredited, which gave the accused brands (Leggo's/Simplot, Coles, Aldi) an opening to dispute the results on methodology grounds rather than the underlying facts. Vero Italiano's lab partners must be accredited from day one to avoid the same standoff.",

    "s3.title": "A separate failure mode: false DOP/IGP compliance",
    "s3.sub": "This cuts across the spectrum above. A product can be genuinely made in Italy from genuine Italian ingredients, and still commit fraud by falsely claiming a protected designation (DOP/IGP/DOC) it doesn't actually meet, or by exploiting the gap between a protected full name and an unprotected generic term.",

    "f1.title": "Generic-name loophole",
    "f1.desc": "The full designation is protected, but a generic translation isn't, so genuine Italian producers and copycats alike sell under the unprotected name outside the EU.",
    "f1.example": "<strong>Real example</strong>\"Parmigiano Reggiano DOP\" is protected, but \"Parmesan\" is a generic term in the U.S. Estimated global fake-parmesan turnover exceeds $2B/year, over 15 times genuine Parmigiano-Reggiano exports.",

    "f2.title": "Adulteration behind a real name",
    "f2.desc": "A product sold under a protected or trusted name is cut with cheaper fillers, undermining the standard even when the label looks compliant.",
    "f2.example": "<strong>Real example</strong>Castle Cheese Inc. was found adding cellulose and cheddar to tubs sold as \"100% Parmesan cheese,\" an FDA adulteration case, not just a labeling dispute.",

    "f3.title": "Grade mislabeling",
    "f3.desc": "A lower legal grade is sold under the label of a higher, more valuable one; the product is real and often genuinely Italian, but the quality claim is false.",
    "f3.example": "<strong>Real example</strong>Italian and class-action investigations found Bertolli, Carapelli, Filippo Berio, Sasso and Coricelli oils labeled \"extra virgin\" when lab testing indicated ordinary virgin-grade oil.",

    "f4.title": "Undisclosed origin substitution",
    "f4.desc": "Genuine domestic production is quietly diluted with cheaper foreign input, then sold under a claim of exclusive domestic origin.",
    "f4.example": "<strong>Real example</strong>Petti, one of Italy's largest tomato processors, was found blending Chinese-grown (Xinjiang) tomato paste into product labeled \"100% Italian tomatoes,\" a repeat offense (2021 seizure, 2024 BBC exposure) despite otherwise being a real Italian manufacturer.",

    "f5.title": "Rules-of-origin exploitation",
    "f5.desc": "Legal \"last substantial transformation\" rules are used to attach a country-of-origin label to a product whose real value-add happened elsewhere.",
    "f5.example": "<strong>Real example</strong>Prato's Chinese-owned garment factories perform final assembly in Italy specifically to qualify for a \"Made in Italy\" label under EU origin rules, despite most production happening in Chinese-run supply chains.",

    "f6.title": "Counterfeit / trademark infringement",
    "f6.desc": "Outright fake product using a protected name or trademarked packaging design with no legitimate claim at all, a straightforward IP and food-safety crime.",
    "f6.example": "<strong>Real example</strong>Seized shipments of counterfeit Parmigiano Reggiano-branded wheels with forged consortium markings, prompting the current chip-tracing anti-counterfeiting rollout.",

    footer: "Sources: Reuters/Inforum (durum wheat imports), BBC Panorama and Food Fraud Advisors (Petti tomato paste), Forbes/Quartz (Parmigiano Reggiano chip tracing and Castle Cheese), FashionNetwork/YaleGlobal (Prato \"Made in Italy\"), Wikipedia/FoodNavigator (Bertolli ownership), Pasta Affair and CBC (olive oil grade mislabeling), La Voce di New York/ANSA (Italian Sounding market size).<br>Internal working reference, VeriPura / Vero Italiano. Not legal or regulatory guidance."
  },
  it: {
    h1: "Vero Italiano - Spettro di Autenticita",
    subtitle: "Non un semplice cancello superato/non superato, ma uno spettro che va dalla produzione italiana pienamente tracciabile fino al branding puramente evocativo. Ogni livello combina tre fatti indipendenti: dove viene prodotto, da dove provengono gli ingredienti e chi possiede il marchio.",
    "s1.title": "Lo spettro a sette livelli",
    "s1.sub": "I livelli vanno dalla dichiarazione piu forte alla piu debole. I prodotti reali possono collocarsi ovunque su questa scala, e spesso l'etichetta non da alcuna indicazione su dove.",

    "t1.tag": "Pienamente Verificato",
    "t1.title": "Prodotto in Italia, ingredienti verificabilmente coltivati in Italia",
    "t1.desc": "Il prodotto e gli ingredienti hanno entrambi origine in Italia, con tracciabilita fino alla fattoria o alla zona di produzione. Lo standard piu elevato, raro nelle categorie di materie prime su larga scala.",
    "t1.flags": "<span>Made in Italy</span><span>Ingredienti: Italia</span><span>Tracciabile</span>",
    "t1.example": "<strong>Esempio reale</strong>Parmigiano Reggiano DOP e Prosciutto di Parma DOP: il latte e la carne suina devono provenire dalla regione designata, e il consorzio ora inserisce microchip di tracciamento nelle forme per dimostrarlo.",

    "t2.tag": "Sostanzialmente Verificato",
    "t2.title": "Prodotto in Italia, ingredienti chiave storicamente/prevalentemente italiani",
    "t2.desc": "La produzione e l'ingrediente principale tradizionale sono italiani, anche se l'approvvigionamento non e sempre garantito lotto per lotto (ad esempio grano duro nazionale in un'annata di buon raccolto).",
    "t2.flags": "<span>Made in Italy</span><span>Ingredienti: prevalentemente Italia</span>",
    "t2.example": "<strong>Esempio reale</strong>Pastifici artigianali che usano grano duro italiano (ad esempio grano Senatore Cappelli), una categoria in calo poiche la produzione nazionale di grano duro non copre la domanda.",

    "t3.tag": "Prodotto in Italia, Approvvigionato all'Estero",
    "t3.title": "Prodotto in Italia, ingredienti chiave importati",
    "t3.desc": "La produzione avviene realmente in Italia, ma la materia prima principale e importata, spesso senza indicazione in etichetta frontale.",
    "t3.flags": "<span>Made in Italy</span><span>Ingredienti: importati</span>",
    "t3.example": "<strong>Esempio reale</strong>L'Italia e un importatore netto di olio d'oliva: olio spagnolo, greco, tunisino e marocchino viene spedito alla rinfusa, imbottigliato in Italia e venduto come olio d'oliva \"italiano\" (Bertolli, Carapelli, Filippo Berio, Sasso e Coricelli sono stati tutti citati in accertamenti italiani su etichettature scorrette). Anche gran parte della pasta \"italiana\" oggi usa grano duro canadese o statunitense.",

    "t4.tag": "Solo Confezionamento",
    "t4.title": "Confezionato in Italia, prodotto realizzato fuori dall'Italia",
    "t4.desc": "L'unica fase italiana e la finitura o il confezionamento, a volte sufficiente per rivendicare legalmente \"Made in Italy\" secondo le norme basate sull'\"ultima trasformazione sostanziale.\"",
    "t4.flags": "<span>Confezionato in Italia</span><span>Prodotto altrove</span>",
    "t4.example": "<strong>Esempio reale</strong>Le fabbriche tessili di proprieta cinese a Prato rifiniscono i capi in Italia per qualificarsi legalmente per l'etichetta \"Made in Italy\". Nel settore alimentare, il produttore italiano Petti e stato trovato a miscelare, e in alcuni casi sostituire, concentrato di pomodoro cinese (dallo Xinjiang) in scatolame venduto come \"pomodoro 100% italiano\", con un sequestro nel 2021 e un'inchiesta della BBC nel 2024.",

    "t5.tag": "Solo Marchio + Ingredienti Reali",
    "t5.title": "Marchio italiano, prodotto all'estero, con ingredienti italiani",
    "t5.desc": "Un'azienda italiana autentica produce localmente in un mercato estero per servirlo in modo efficiente, importando ingredienti italiani sfusi per preservare l'autenticita.",
    "t5.flags": "<span>Marchio italiano</span><span>Prodotto all'estero</span><span>Ingredienti: Italia</span>",
    "t5.example": "<strong>Esempio reale</strong>Alcuni produttori italiani di olio d'oliva spediscono olio di origine italiana sfuso per essere imbottigliato in impianti nel mercato di destinazione anziche in Italia: l'ingrediente e reale, la dichiarazione di imbottigliamento \"Made in Italy\" non lo e.",

    "t6.tag": "Solo Marchio",
    "t6.title": "Marchio italiano, prodotto all'estero, ingredienti principali dall'estero",
    "t6.desc": "L'azienda e la sua eredita sono autenticamente italiane, ma il prodotto venduto in un dato mercato e fabbricato localmente dall'inizio alla fine.",
    "t6.flags": "<span>Marchio italiano</span><span>Prodotto all'estero</span><span>Ingredienti: estero</span>",
    "t6.example": "<strong>Esempio reale</strong>Barilla e Giovanni Rana gestiscono entrambi stabilimenti produttivi negli Stati Uniti (Barilla: New York/Iowa; Rana: Bartlett, Illinois) usando grano nordamericano per il mercato nordamericano.",

    "t7.tag": "Solo Evocativo",
    "t7.title": "Nome dal suono italiano, prodotto all'estero, ingredienti dall'estero",
    "t7.desc": "Nessun legame di proprieta, produzione o approvvigionamento italiano, solo un nome, i colori della bandiera o immagini pensate per evocare l'Italia. Questo e il fenomeno dell'\"Italian Sounding\".",
    "t7.flags": "<span>Nessun legame italiano</span><span>Prodotto all'estero</span><span>Ingredienti: estero</span>",
    "t7.example": "<strong>Esempio reale</strong>Il sugo Bertolli: marchio concesso in licenza dalla storica azienda italiana di olio d'oliva, ora di proprieta della societa giapponese-americana Mizkan e prodotto a Owensboro, Kentucky e Stockton, California con pomodori statunitensi. A livello di settore, i prodotti \"Italian Sounding\" generano una stima di 55-120 miliardi di euro l'anno nel mondo, con circa il 97% dei sughi \"italiani\" e il 76% dei pomodori in scatola sul mercato nordamericano risultati non italiani.",

    "s2.title": "Il motore di verifica: documenti contro il campo",
    "s2.sub": "Ogni livello sopra descritto e una dichiarazione su carta. VeriPura verifica la dichiarazione confrontandola con due flussi di evidenza indipendenti e li riconcilia: questo e cio che trasforma un livello autodichiarato in uno verificato.",
    "engine.docHeading": "Cosa dice la documentazione",
    "engine.doc1": "Fatture, dichiarazioni doganali, documenti di lotto e di spedizione",
    "engine.doc2": "Volumi e dichiarazioni di origine autodichiarati da produttore/importatore",
    "engine.doc3": "Registri e attestati di appartenenza al consorzio",
    "engine.satHeading": "Cosa mostra il campo",
    "engine.sat1": "Immagini satellitari dell'area coltivata, salute delle colture e tempistica del raccolto",
    "engine.sat2": "Modelli agronomici di resa per regione/varieta/stagione",
    "engine.sat3": "Stima indipendente del volume massimo di produzione plausibile",
    "engine.reconcileHeading": "Riconciliazione",
    "engine.reconcileDesc": "Il volume e l'origine dichiarati vengono confrontati con la capacita produttiva stimata in modo indipendente per quel coltivatore, appezzamento e stagione. Una corrispondenza stretta aumenta la fiducia; uno scostamento segnala la dichiarazione per una revisione prima del rilascio della certificazione.",
    "engine.ok": "<strong>Entro l'intervallo previsto</strong>Il volume dichiarato e coerente con la capacita di resa stimata via satellite: la dichiarazione supporta il livello di certificazione richiesto.",
    "engine.flag": "<strong>Segnalato per revisione</strong>Il volume dichiarato supera la produzione plausibile sul campo, segnalando possibile miscelazione non dichiarata, sostituzione o origine sovrastimata (come nel caso Petti del concentrato di pomodoro).",
    "engine.catchesHeading": "Cosa individua nello specifico",
    "engine.catch1": "Livello 3, ingredienti importati non dichiarati",
    "engine.catch2": "Livello 4, dichiarazioni \"Made in Italy\" basate solo sul confezionamento",
    "engine.catch3": "Frode #4, sostituzione di origine non dichiarata",
    "engine.catch4": "Sovrastima del volume oltre la reale capacita produttiva",

    "s2b.title": "Livello premium: certificazione Lab-Verified",
    "s2b.sub": "I documenti e i dati satellitari confermano una storia plausibile. Non possono confermare cosa ci sia fisicamente dentro la confezione. Questo livello premium opzionale aggiunge test forensi indipendenti sopra qualsiasi livello dello spettro.",
    "lab.title": "Vero Italiano Lab-Verified",
    "lab.desc": "Un marchio premium distinto, sovrapposto allo spettro a sette livelli, basato su test fisici/forensi accreditati (analisi del rapporto isotopico stabile, codice a barre del DNA, profilazione NMR) anziche solo su documenti e immagini. Richiede laboratori partner accreditati ISO 17025 (o equivalente) e una catena di custodia documentata, cosi che i risultati reggano in caso di contestazione.",
    "lab.mode1.h": "Test su richiesta",
    "lab.mode1.p": "Un importatore, o il motore di riconciliazione stesso quando viene segnalata una discrepanza, attiva un test di laboratorio su un lotto specifico. Fatturato per test piu un margine, offre all'importatore un risultato concreto da mostrare a un acquirente al dettaglio scettico.",
    "lab.mode2.h": "Test casuali ponderati per rischio",
    "lab.mode2.p": "I lotti certificati vengono selezionati periodicamente e in modo imprevedibile per test a sorpresa, con maggiore frequenza per i prodotti di maggior valore e per chi ha una storia di discrepanze pregresse, finanziati dal fondo di abbonamenti/commissioni o da un consorzio interessato. Questo e cio che mantiene onesta una certificazione tra un audit e l'altro, invece di un controllo una tantum che un attore in malafede puo pianificare in anticipo.",
    "lab.note": "Perche l'accreditamento non e negoziabile: nell'indagine di Four Corners sui pomodori in Australia nel 2026, il laboratorio forense dietro le scoperte di frode (Source Certain) non era accreditato NATA, il che ha dato ai marchi accusati (Leggo's/Simplot, Coles, Aldi) un'apertura per contestare i risultati sul piano metodologico anziche sui fatti sottostanti. I laboratori partner di Vero Italiano devono essere accreditati fin dal primo giorno per evitare lo stesso stallo.",

    "s3.title": "Un'altra modalita di frode: falsa conformita DOP/IGP",
    "s3.sub": "Questo aspetto attraversa trasversalmente lo spettro sopra descritto. Un prodotto puo essere autenticamente realizzato in Italia con ingredienti autenticamente italiani, e commettere comunque una frode dichiarando falsamente una denominazione protetta (DOP/IGP/DOC) che in realta non soddisfa, oppure sfruttando il divario tra un nome completo protetto e un termine generico non protetto.",

    "f1.title": "Scappatoia del nome generico",
    "f1.desc": "La denominazione completa e protetta, ma una traduzione generica non lo e, cosi sia i produttori italiani autentici sia gli imitatori vendono sotto il nome non protetto fuori dall'UE.",
    "f1.example": "<strong>Esempio reale</strong>\"Parmigiano Reggiano DOP\" e protetto, ma \"Parmesan\" e un termine generico negli Stati Uniti. Il fatturato globale stimato del falso parmigiano supera i 2 miliardi di dollari l'anno, oltre 15 volte le esportazioni di Parmigiano Reggiano autentico.",

    "f2.title": "Adulterazione dietro un nome reale",
    "f2.desc": "Un prodotto venduto con un nome protetto o affidabile viene tagliato con riempitivi piu economici, compromettendo lo standard anche quando l'etichetta sembra conforme.",
    "f2.example": "<strong>Esempio reale</strong>Castle Cheese Inc. e stata trovata ad aggiungere cellulosa e cheddar a confezioni vendute come \"formaggio Parmesan al 100%\", un caso di adulterazione accertato dalla FDA, non solo una disputa sull'etichettatura.",

    "f3.title": "Etichettatura errata della categoria",
    "f3.desc": "Una categoria legale inferiore viene venduta sotto l'etichetta di una categoria superiore e piu pregiata; il prodotto e reale e spesso autenticamente italiano, ma la dichiarazione di qualita e falsa.",
    "f3.example": "<strong>Esempio reale</strong>Indagini italiane e class action hanno rilevato che gli oli Bertolli, Carapelli, Filippo Berio, Sasso e Coricelli erano etichettati come \"extra vergine\" quando i test di laboratorio indicavano un olio di categoria vergine ordinaria.",

    "f4.title": "Sostituzione di origine non dichiarata",
    "f4.desc": "Una produzione nazionale autentica viene diluita silenziosamente con materia prima estera piu economica, poi venduta con la dichiarazione di origine esclusivamente nazionale.",
    "f4.example": "<strong>Esempio reale</strong>Petti, uno dei maggiori trasformatori di pomodoro in Italia, e stata trovata a miscelare concentrato di pomodoro coltivato in Cina (Xinjiang) in prodotti etichettati come \"pomodoro 100% italiano\", una recidiva (sequestro nel 2021, inchiesta BBC nel 2024) pur essendo altrimenti un produttore italiano autentico.",

    "f5.title": "Sfruttamento delle regole di origine",
    "f5.desc": "Le norme legali sull'\"ultima trasformazione sostanziale\" vengono usate per attribuire un'etichetta di origine a un prodotto il cui reale valore aggiunto e avvenuto altrove.",
    "f5.example": "<strong>Esempio reale</strong>Le fabbriche di abbigliamento di proprieta cinese a Prato eseguono l'assemblaggio finale in Italia specificamente per qualificarsi per l'etichetta \"Made in Italy\" secondo le norme di origine UE, nonostante la maggior parte della produzione avvenga in filiere gestite da aziende cinesi.",

    "f6.example": "<strong>Esempio reale</strong>Sequestri di forme contraffatte a marchio Parmigiano Reggiano con marchiature del consorzio falsificate, che hanno spinto l'attuale introduzione di microchip anticontraffazione.",

    footer: "Fonti: Reuters/Inforum (importazioni di grano duro), BBC Panorama e Food Fraud Advisors (concentrato di pomodoro Petti), Forbes/Quartz (tracciamento a chip del Parmigiano Reggiano e caso Castle Cheese), FashionNetwork/YaleGlobal (\"Made in Italy\" a Prato), Wikipedia/FoodNavigator (proprieta di Bertolli), Pasta Affair e CBC (etichettatura errata della categoria dell'olio d'oliva), La Voce di New York/ANSA (dimensione del mercato \"Italian Sounding\").<br>Riferimento di lavoro interno, VeriPura / Vero Italiano. Non costituisce consulenza legale o normativa."

function setLang(lang){
  var dict = translations[lang];
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var key = el.getAttribute('data-i18n');
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-it').classList.toggle('active', lang === 'it');
  document.documentElement.setAttribute('lang', lang);
}
setLang('en');
</script>
